name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        id: build
        uses: geode-sdk/build-geode-mod@main

      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: ${{ steps.build.outputs.build-output }}
